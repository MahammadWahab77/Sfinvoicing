# .github/workflows/deploy.yml
# GitHub CI/CD workflow for NxtWave SF Invoicing Service
#
# GitHub Secrets needed:
# - GCP_SA_KEY: Service account JSON key with Cloud Run and Cloud Build permissions
# - GCP_PROJECT_ID: Your GCP project ID

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE_NAME: invoice-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 120 \
            --set-env-vars "GOOGLE_TEMPLATE_FILE_ID=YOUR_GOOGLE_TEMPLATE_FILE_ID,GOOGLE_DOCS_FOLDER_ID=YOUR_GOOGLE_DOCS_FOLDER_ID,GOOGLE_PDFS_FOLDER_ID=YOUR_GOOGLE_PDFS_FOLDER_ID,SF_LOGIN_DOMAIN=YOUR_SF_LOGIN_DOMAIN,SF_API_VERSION=61.0" \
            --set-secrets "X_API_KEY=X_API_KEY:latest,SF_CLIENT_ID=SF_CLIENT_ID:latest,SF_CLIENT_SECRET=SF_CLIENT_SECRET:latest"

      - name: Print service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format "value(status.url)"
